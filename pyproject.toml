[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radii"
version = "1.0.0"
description = "Radius-resolved benchmark of nanoparticle structures for generative models in materials science (KDD'26)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Can Polat", email = "can.polat@tamu.edu" },
    { name = "Erchin Serpedin", email = "eserpedin@tamu.edu" },
    { name = "Mustafa Kurban", email = "kurbanm@ankara.edu.tr" },
    { name = "Hasan Kurban", email = "hkurban@hbku.edu.qa" },
]
keywords = [
    "materials-science", "crystal-structures", "generative-models",
    "benchmark", "kdd-2026", "out-of-distribution",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "torch>=2.0.0",
    "torch_geometric>=2.4.0",
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "scipy>=1.10",
    "ase>=3.22",
    "tqdm>=4.65",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
hf = ["datasets>=3.0", "pyarrow>=14"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
radii-train = "radii.train:main"
radii-generate = "radii.generation.create_radii:main"

[project.urls]
Paper = "https://doi.org/10.1145/3770855.3818872"
Dataset = "https://doi.org/10.5281/zenodo.20431021"
HuggingFace = "https://huggingface.co/datasets/KurbanIntelligenceLab/RADII"
Source = "https://github.com/KurbanIntelligenceLab/RADII"
Issues = "https://github.com/KurbanIntelligenceLab/RADII/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radii = ["py.typed"]
